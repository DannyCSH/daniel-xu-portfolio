<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="许哲安 AI 产品经理项目展示看板">
  <title>项目看板 · 许哲安 AI 产品经理作品集</title>
  <link rel="stylesheet" href="project-dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="dashboard-topbar">
    <div class="topbar-inner">
      <a class="back-link" href="index.html">← 返回作品集</a>
      <label class="project-switcher-label" for="project-switcher">切换项目</label>
      <select id="project-switcher" class="project-switcher" aria-label="切换项目"></select>
    </div>
  </header>

  <main id="main" class="dashboard-main">
    <header class="project-hero">
      <div class="project-identity">
        <p id="project-kicker" class="project-kicker"></p>
        <h1 id="project-title"></h1>
        <p id="project-subtitle" class="project-subtitle"></p>
        <p id="project-summary" class="project-summary"></p>
      </div>
      <div class="status-panel" aria-label="项目状态">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="project-status"></span>
      </div>
    </header>

    <nav id="project-actions" class="action-bar" aria-label="项目演示与材料入口"></nav>

    <section aria-labelledby="metrics-heading" class="metrics-band">
      <h2 id="metrics-heading" class="section-eyebrow">验证信号</h2>
      <div id="metrics-grid" class="metrics-grid"></div>
    </section>

    <section aria-labelledby="workflow-heading" class="dashboard-section">
      <div class="section-heading-row">
        <div>
          <p class="section-eyebrow">产品机制</p>
          <h2 id="workflow-heading">核心工作流</h2>
        </div>
        <p id="workflow-note" class="section-note"></p>
      </div>
      <ol id="workflow" class="workflow"></ol>
    </section>

    <div class="detail-layout">
      <section aria-labelledby="contribution-heading" class="dashboard-section detail-section">
        <p class="section-eyebrow">角色与判断</p>
        <h2 id="contribution-heading">我的贡献</h2>
        <ul id="contributions" class="detail-list"></ul>
      </section>

      <section aria-labelledby="evidence-heading" class="dashboard-section detail-section">
        <p class="section-eyebrow evidence-eyebrow">可核验</p>
        <h2 id="evidence-heading">证据与结果</h2>
        <ul id="evidence" class="detail-list evidence-list"></ul>
      </section>
    </div>

    <section aria-labelledby="boundary-heading" class="boundary-band">
      <div>
        <p class="section-eyebrow">公开边界</p>
        <h2 id="boundary-heading">当前不能声称什么</h2>
      </div>
      <ul id="boundaries" class="boundary-list"></ul>
    </section>

    <section aria-labelledby="interview-heading" class="interview-band">
      <p class="section-eyebrow">面试主张</p>
      <h2 id="interview-heading">这个项目证明了什么</h2>
      <p id="interview-value"></p>
    </section>
  </main>

  <footer class="dashboard-footer">
    <p>许哲安 · AI 产品经理 · 项目事实与边界以本地证据档案为准</p>
  </footer>

  <script src="project-dashboard.js"></script>
</body>
</html>
