<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CATL 四层映射 Demo - 增强版</title>
  <link rel="stylesheet" href="./styles-enhanced.css" />
</head>
<body>
  <div class="page-shell">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand-block">
        <p class="eyebrow">HKU x CATL Demo</p>
        <h1>四层映射前端</h1>
        <p class="brand-copy">
          这不是官方报送系统，而是一个让同学、老师和后续开发者都能快速看懂的演示前端。
        </p>
      </div>

      <!-- 角色切换器 -->
      <div class="role-switcher">
        <div class="role-switcher-title">角色切换</div>
        <div id="role-switcher"></div>
      </div>

      <!-- 导航列表 -->
      <nav class="nav-list" id="nav-list"></nav>

      <!-- 核心提示 -->
      <div class="sidebar-note">
        <p class="note-title">一句人话</p>
        <p id="core-message"></p>
      </div>
    </aside>

    <!-- 主面板 -->
    <main class="main-panel">
      <!-- 顶部角色提示 -->
      <div class="role-tip-bar" id="role-tip"></div>

      <!-- Hero 区 -->
      <header class="hero">
        <div>
          <p class="eyebrow">Demo Product</p>
          <h2 id="product-title"></h2>
          <p id="product-subtitle" class="hero-subtitle"></p>
        </div>
        <div class="hero-stats" id="hero-stats"></div>
      </header>

      <!-- 工具栏 -->
      <div class="toolbar">
        <div class="view-mode-toggle" id="view-mode-toggle"></div>
        <div class="filter-bar" id="filter-bar"></div>
      </div>

      <!-- 各视图区块 -->
      <section class="section-panel" id="view-overview"></section>
      <section class="section-panel hidden" id="view-eu"></section>
      <section class="section-panel hidden" id="view-cbam"></section>
      <section class="section-panel hidden" id="view-layers"></section>
      <section class="section-panel hidden" id="view-catl"></section>
      <section class="section-panel hidden" id="view-dev"></section>
    </main>
  </div>

  <!-- 证据链弹窗 -->
  <div class="modal-overlay" id="evidence-modal">
    <div class="evidence-modal">
      <div id="evidence-modal-content"></div>
    </div>
  </div>

  <script src="./data/demo-data.js"></script>
  <script src="./app-enhanced.js"></script>
</body>
</html>
