        <div class="quick-grid">
          <a class="quick-entry" href="growth/index.html"><span class="entry-icon"><i data-lucide="radar"></i></span><span>增量拓客</span></a>

      <div class="home-divider" aria-hidden="true"></div>

          <a class="notice-row" href="stock/index.html?customer=c1"><span class="notice-icon"><i data-lucide="calendar-check-2"></i></span><span><h3>深圳智芯半导体 · 设备更新需求访谈</h3><p>额度缺口 2,600 万 · 建议本周拜访</p></span><i data-lucide="chevron-right"></i></a>
