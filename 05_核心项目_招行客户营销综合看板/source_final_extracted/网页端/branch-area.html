<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>支行辖区总览</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <nav class="page-nav">
      <a class="back" href="index.html">← 返回网点地图</a>
      <div>
        <h1 id="branchTitle">支行辖区总览</h1>
        <div class="sub" id="branchSub">—</div>
      </div>
    </nav>

    <div class="page-body">
      <section class="card map-card">
        <div class="card-title">
          辖区地图
          <span class="hint">圆内为管辖区域 · 圆圈=企业（大小=分层，深浅=规模，颜色=行业）</span>
        </div>
        <div class="industry-tabs" id="industryTabs"></div>
        <div class="map-box" id="branchMap"></div>
      </section>

      <aside style="display:flex;flex-direction:column;gap:16px;">
        <section class="card">
          <div class="card-title">当前产业链</div>
          <div class="stat-row">
            <div class="stat-pill">
              <div class="lab">链上企业数量</div>
              <div class="val" id="chainCount">0</div>
            </div>
            <div class="stat-pill">
              <div class="lab">景气度评分</div>
              <div class="val" id="chainScore">—</div>
            </div>
          </div>
          <div class="legend-note" id="chainHint">
            选择产业链后，地图仅展示该行业企业。点击企业圆圈进入客户画像。
          </div>
        </section>

        <section class="card" style="flex:1;">
          <div class="card-title">
            产业链景气度排行榜
            <span class="hint">评分 · 趋势</span>
          </div>
          <div class="rank-list" id="rankList"></div>
          <div class="legend-note">
            趋势箭头依据近6期景气度序列：↑上升 / →平稳 / ↗缓升。排行用于支行投放优先级参考。
          </div>
        </section>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="data/mock.js"></script>
  <script src="data/chains.js"></script>
  <script src="js/branch-area.js"></script>
</body>
</html>
